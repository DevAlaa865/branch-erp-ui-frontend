<div class="p-6 space-y-6">

  <h1 class="text-2xl font-bold text-gray-800">ترحيل يدوي للنقدية</h1>

  <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-4 rounded-xl shadow">

    <!-- الفرع -->
    <app-custom-select
      label="الفرع"
      [items]="branches"
      bindLabel="branchName"
      bindValue="id"
      [control]="form.get('branchId')">
    </app-custom-select>

    <!-- التاريخ -->
    <div class="col-md-4 mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">التاريخ</label>

      <div class="flex items-center gap-2 bg-white/80 border border-slate-300 rounded-xl px-3 py-2 shadow-sm hover:shadow-md transition-all">
        <i class="fa fa-calendar text-blue-500 text-lg"></i>

        <input type="date"
               formControlName="date"
               lang="en"
               class="w-full bg-transparent text-slate-700 text-base focus:outline-none">
      </div>
    </div>

    <!-- مسؤول الإيداع -->
    <app-custom-select
      label="مسؤول الإيداع"
      [items]="collectors"
      bindLabel="userName"
      bindValue="id"
      [control]="form.get('depositCollectorId')">
    </app-custom-select>

    <!-- المبلغ اليدوي -->
    <div class="col-md-4 mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">المبلغ</label>

      <div class="flex items-center gap-2 bg-white/80 border border-slate-300 rounded-xl px-3 py-2 shadow-sm hover:shadow-md transition-all">
        <i class="fa fa-money-bill text-green-500 text-lg"></i>

        <input type="number"
               formControlName="amount"
               class="w-full bg-transparent text-slate-700 text-base focus:outline-none"
               placeholder="ادخل المبلغ اليدوي">
      </div>
    </div>

    <!-- زر الترحيل -->
    <button type="button"
            (click)="submit()"
            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow">
      ترحيل يدوي
    </button>

  </form>

  <!-- النتيجة -->
  <div *ngIf="result" class="bg-white p-4 rounded-xl shadow border border-gray-100">

    <h2 class="text-xl font-bold text-green-700 mb-4">تم الترحيل بنجاح</h2>

    <p class="text-gray-700"><strong>الفرع:</strong> {{ result.branchName }}</p>
    <p class="text-gray-700"><strong>المدينة:</strong> {{ result.cityName }}</p>
    <p class="text-gray-700"><strong>الصندوق:</strong> {{ result.cashBoxName }}</p>
    <p class="text-gray-700"><strong>المبلغ:</strong> {{ result.amount | number }}</p>
    <p class="text-gray-700"><strong>التاريخ:</strong> {{ result.date }}</p>

  </div>

</div>
