<div class="container mt-4">

  <div class="card shadow-sm upload-card">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <span>رفع ملف تارجت الفروع (Excel)</span>
      <i class="bi bi-file-earmark-excel"></i>
    </div>

    <div class="card-body">

      <p class="text-muted">
        اختر ملف الإكسل الذي يحتوي على تارجت الفروع لليوم، وسيتم توزيع التارجت تلقائيًا على الفروع.
      </p>

      <div class="mb-3">
        <label class="form-label">ملف الإكسل:</label>
        <input type="file"
               class="form-control"
               accept=".xlsx,.xls"
               (change)="onFileChange($event)">
      </div>

      <button class="btn btn-success"
              [disabled]="isUploading || !selectedFile"
              (click)="upload()">
        <span *ngIf="!isUploading">رفع الملف</span>
        <span *ngIf="isUploading">
          <span class="spinner-border spinner-border-sm"></span>
          جاري الرفع...
        </span>
      </button>

      <div class="mt-3" *ngIf="message">
        <div [ngClass]="{'alert alert-success': isSuccess, 'alert alert-danger': isSuccess === false}">
          {{ message }}
        </div>
      </div>

    </div>
  </div>

</div>
