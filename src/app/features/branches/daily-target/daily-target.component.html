<div class="max-w-5xl mx-auto p-6 space-y-6">

  <!-- Header Card -->
  <div class="bg-white shadow-lg rounded-xl p-6 border border-gray-200 animate-fade-in">
    <h2 class="text-2xl font-bold text-gray-800 mb-4">🎯 تسجيل التارجت اليومي للفرع</h2>

    <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Branch -->
      <app-custom-select
        label="الفرع"
        [items]="branches"
        bindLabel="branchName"
        bindValue="id"
        placeholder="اختر الفرع"
        [control]="form.get('branchId')">
      </app-custom-select>

      <!-- Date -->
      <div>
        <label class="font-semibold">التاريخ</label>
        <input type="date" formControlName="targetDate" class="input" />
      </div>

      <!-- Total Target -->
      <div>
        <label class="font-semibold">تارجت الفرع</label>
        <input type="number" formControlName="totalBranchTarget" class="input" />
      </div>

      <!-- Total Achieved -->
      <div>
        <label class="font-semibold">المنجز</label>
        <input type="number" formControlName="totalAchieved" class="input" />
      </div>

    </form>
  </div>

  <!-- Details Card -->
  <div class="bg-white shadow-lg rounded-xl p-6 border border-gray-200 animate-slide-up">

    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-bold text-gray-700">👥 تفاصيل الموظفين</h3>
      <button type="button" (click)="addRow()" class="btn-primary">+ إضافة موظف</button>
    </div>

    <div formArrayName="details" class="space-y-4">

      <div *ngFor="let row of details.controls; let i = index"
           [formGroupName]="i"
           class="border border-gray-300 rounded-lg p-4 bg-gray-50 shadow-sm hover:shadow-md transition">

        <div class="grid grid-cols-1 md:grid-cols-4 gap-4">

          <!-- Employee -->
          <app-custom-select
            label="الموظف"
            [items]="employees"
            bindLabel="fullName"
            bindValue="id"
            placeholder="اختر موظف"
            [control]="row.get('employeeId')">
          </app-custom-select>

          <!-- Shift -->
          <app-custom-select
            label="الوردية"
            [items]="shifts"
            bindLabel="name"
            bindValue="id"
            placeholder="اختر الوردية"
            [control]="row.get('shift')">
          </app-custom-select>

          <!-- Target -->
          <div>
            <label class="font-semibold">تارجت الموظف</label>
            <input type="number" formControlName="employeeTarget" class="input" />
          </div>

          <!-- Achieved -->
          <div>
            <label class="font-semibold">المنجز</label>
            <input type="number" formControlName="employeeAchieved" class="input" />
          </div>

        </div>

        <button type="button"
                (click)="removeRow(i)"
                class="btn-danger mt-3">
          حذف
        </button>

      </div>

    </div>

  </div>

  <!-- Save Button -->
  <div class="text-center">
    <button type="button" (click)="save()" class="btn-primary px-8 py-3 text-lg">
      💾 حفظ التارجت
    </button>
  </div>

</div>
