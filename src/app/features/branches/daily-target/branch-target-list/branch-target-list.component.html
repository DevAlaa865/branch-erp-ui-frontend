<!-- ============================= -->
<!--        فلتر البحث            -->
<!-- ============================= -->

<form [formGroup]="filterForm"
      class="space-y-6 bg-white p-6 rounded-2xl shadow-md border border-gray-200">

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

    <!-- المدينة -->
    <app-custom-select
      label="المدينة"
      [items]="cityOptions"
      bindLabel="name"
      bindValue="id"
      [control]="filterForm.get('cityId')">
    </app-custom-select>

    <!-- الفرع -->
    <app-custom-select
      label="الفرع"
      [items]="branchOptions"
      bindLabel="name"
      bindValue="id"
      [control]="filterForm.get('branchId')">
    </app-custom-select>

    <!-- التاريخ -->
    <div class="flex flex-col">
      <label class="text-slate-700 font-medium mb-1">التاريخ</label>
      <input type="date"
             formControlName="date"
             class="border border-gray-300 p-2 rounded-lg w-full focus:ring-2 focus:ring-blue-400 focus:border-blue-400 transition" />
    </div>

  </div>

  <div class="flex justify-end">
    <button type="button"
            (click)="loadTargets()"
            class="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow transition">
      بحث
    </button>
  </div>

</form>


<!-- ============================= -->
<!--       جدول عرض التارجت       -->
<!-- ============================= -->

<div class="mt-8 bg-white p-6 rounded-2xl shadow-md border border-gray-200">

  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold text-slate-800">نتائج البحث</h2>

    <div class="flex gap-3" *ngIf="targets.length > 0">

      <!-- زر الشارت العام -->
      <button
        (click)="openChartForAll()"
        class="px-5 py-2 bg-purple-600 hover:bg-purple-700 text-white rounded-lg shadow transition">
        عرض الشارت
      </button>

      <!-- زر تحميل Excel -->
      <button
        (click)="exportToExcel()"
        class="px-5 py-2 bg-green-600 hover:bg-green-700 text-white rounded-lg shadow transition">
        تحميل Excel
      </button>

    </div>
  </div>

  <div class="overflow-x-auto mt-6">
    <table class="w-full border-collapse">
      <thead>
        <tr class="bg-blue-50 text-right border-b">
          <th class="p-3 font-semibold text-slate-700">الفرع</th>
          <th class="p-3 font-semibold text-slate-700">التاريخ</th>
          <th class="p-3 font-semibold text-slate-700">التارجت</th>
          <th class="p-3 font-semibold text-slate-700">المنجز</th>
          <th class="p-3 font-semibold text-slate-700">نسبة الإنجاز</th>
          <th class="p-3 font-semibold text-slate-700 text-center">الإجراءات</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let t of targets" class="border-b hover:bg-blue-50 transition">

          <td class="p-3">{{ t.branchName }}</td>

          <!-- التاريخ بدون وقت -->
          <td class="p-3">{{ t.targetDate | date:'yyyy-MM-dd' }}</td>

          <td class="p-3">{{ t.totalBranchTarget }}</td>
          <td class="p-3">{{ t.totalAchieved }}</td>

          <!-- نسبة الإنجاز -->
          <td class="p-3">
            <span
              class="px-2 py-1 rounded-full text-xs font-semibold flex items-center gap-1"
              [ngClass]="{
                'bg-green-100 text-green-700': t.achievementPercentage >= 80,
                'bg-red-100 text-red-700': t.achievementPercentage < 80
              }">

              <i class="fa"
                 [ngClass]="{
                   'fa-arrow-up': t.achievementPercentage >= 80,
                   'fa-arrow-down': t.achievementPercentage < 80
                 }"></i>

              {{ t.achievementPercentage }}%
            </span>
          </td>

          <!-- الإجراءات -->
          <td class="p-3 text-center space-x-2">

            <button (click)="viewDetails(t.id)"
                    class="px-3 py-1 bg-gray-700 hover:bg-gray-800 text-white rounded-lg transition">
              تفاصيل
            </button>

            <button (click)="edit(t.id)"
                    class="px-3 py-1 bg-green-600 hover:bg-green-700 text-white rounded-lg transition">
              تعديل
            </button>

            <button (click)="delete(t.id)"
                    class="px-3 py-1 bg-red-600 hover:bg-red-700 text-white rounded-lg transition">
              حذف
            </button>

          </td>

        </tr>

        <tr *ngIf="targets.length === 0">
          <td colspan="6" class="text-center p-6 text-gray-500">
            لا توجد بيانات للعرض
          </td>
        </tr>

      </tbody>
    </table>
  </div>


  <!-- ============================= -->
  <!--           الباجينيشن         -->
  <!-- ============================= -->

  <div class="flex justify-between items-center mt-6">

    <button
      class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg transition disabled:opacity-50"
      [disabled]="page === 1"
      (click)="page = page - 1; loadTargets()">
      السابق
    </button>

    <span class="text-gray-700 font-medium">
      صفحة {{ page }}
    </span>

    <button
      class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-lg transition disabled:opacity-50"
      [disabled]="targets.length < pageSize"
      (click)="page = page + 1; loadTargets()">
      التالي
    </button>

  </div>

</div>
