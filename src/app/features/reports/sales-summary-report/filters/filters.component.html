<!-- 🔵 كارت الفلاتر -->
<div class="bg-slate-100 border border-slate-300 rounded-2xl p-6 shadow-md">

  <!-- عنوان التقرير -->
  <h2 class="text-xl font-bold text-slate-800 mb-6">
    تقرير المبيعات للفروع
  </h2>

  <!-- الفلاتر -->
  <form [formGroup]="filterForm"
        (ngSubmit)="submit()"
        class="grid grid-cols-1 lg:grid-cols-5 gap-4 items-end text-blue-800">

    <!-- من تاريخ -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">من تاريخ</label>
      <div class="flex items-center gap-2 rounded-lg border border-blue-300 bg-white px-3 py-2 shadow-sm">
        <i class="fa fa-calendar text-blue-500 text-base"></i>
        <input type="date"
               formControlName="fromDate"
               class="w-full bg-transparent text-base text-slate-800 focus:outline-none">
      </div>
    </div>

    <!-- إلى تاريخ -->
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">إلى تاريخ</label>
      <div class="flex items-center gap-2 rounded-lg border border-blue-300 bg-white px-3 py-2 shadow-sm">
        <i class="fa fa-calendar text-blue-500 text-base"></i>
        <input type="date"
               formControlName="toDate"
               class="w-full bg-transparent text-base text-slate-800 focus:outline-none">
      </div>
    </div>

    <!-- المنطقة -->
    <div>
      <app-custom-select
        label="المنطقة"
        [items]="regions"
        bindLabel="label"
        bindValue="id"
        placeholder="اختر المنطقة"
        [control]="filterForm.get('regionId')"
        [searchable]="true"
        [clearable]="true"
        dropdownPosition="bottom">
      </app-custom-select>
    </div>

    <!-- المدينة -->
    <div>
      <app-custom-select
        label="المدينة"
        [items]="filteredCities"
        bindLabel="label"
        bindValue="id"
        placeholder="اختر المدينة"
        [control]="filterForm.get('cityId')"
        [searchable]="true"
        [clearable]="true"
        dropdownPosition="bottom">
      </app-custom-select>
    </div>

    <!-- الفرع -->
    <div>
      <app-custom-select
        label="الفرع"
        [items]="filteredBranches"
        bindLabel="label"
        bindValue="id"
        placeholder="اختر الفرع"
        [control]="filterForm.get('branchId')"
        [searchable]="true"
        [clearable]="true"
        dropdownPosition="bottom">
      </app-custom-select>
    </div>

    <!-- زر عرض التقرير -->
    <div class="lg:col-span-5 flex justify-end mt-4">
      <button type="submit"
              class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-2.5 rounded-lg shadow-md transition">
        🔍 عرض التقرير
      </button>
    </div>

  </form>

</div>
