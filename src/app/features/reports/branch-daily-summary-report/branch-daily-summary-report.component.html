<div class="p-6 pb-24 bg-white rounded-2xl shadow border max-w-7xl mx-auto mt-6 fade-in">

  <!-- 🔵 عنوان التقرير -->
  <div class="flex items-center gap-3 mb-6 animate-slide-down">
    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-600 to-blue-800 flex items-center justify-center text-white shadow">
      <i class="fa fa-chart-column text-xl"></i>
    </div>
    <div>
      <h2 class="text-xl font-extrabold text-slate-900">تقرير يوميات الفروع المجمع</h2>
      <p class="text-sm text-slate-500">اختر الفترة والفلاتر لعرض تقرير مجمع لكل الفروع.</p>
    </div>
  </div>

  <!-- 🔵 فورم الفلاتر -->
  <div class="bg-white border border-slate-200 rounded-2xl shadow p-6 animate-fade">

<form [formGroup]="form" class="filter-row">

  <!-- من تاريخ -->
  <div class="filter-item">
    <label class="block text-sm font-medium text-slate-700 mb-1">من تاريخ</label>
    <div class="filter-box">
      <i class="fa fa-calendar"></i>
      <input type="date" formControlName="fromDate">
    </div>
  </div>

  <!-- إلى تاريخ -->
  <div class="filter-item">
    <label class="block text-sm font-medium text-slate-700 mb-1">إلى تاريخ</label>
    <div class="filter-box">
      <i class="fa fa-calendar"></i>
      <input type="date" formControlName="toDate">
    </div>
  </div>

  <!-- نوع الفرع -->
  <div class="filter-item">
    <label class="block text-sm font-medium text-slate-700 mb-1">نوع الفرع</label>
    <div class="filter-box">
      <i class="fa fa-store"></i>
      <select formControlName="branchType">
        <option value="All">الكل</option>
        <option value="Shop">محل</option>
        <option value="Kiosk">كشك</option>
      </select>
    </div>
  </div>

  <!-- المدينة -->
  <div class="filter-item text-black">
    <label class="block text-sm font-medium text-slate-700 mb-1">المدينة</label>

   
      <app-custom-select
        [items]="cities"
        bindLabel="cityName"
        bindValue="id"
        placeholder="كل المدن"
        [control]="cityIdsControl"
        [multiple]="true"
        [closeOnSelect]="false"
        [searchable]="true"
        [clearable]="true"
        [dropdownPosition]="'bottom'">
      </app-custom-select>
    </div>


  <!-- نوع النشاط -->
  <div class="filter-item">
    <label class="block text-sm font-medium text-slate-700 mb-1">نوع النشاط</label>
    <div class="filter-box">
      <i class="fa fa-briefcase"></i>
      <select formControlName="activityTypeId">
        <option [ngValue]="null">الكل</option>
        <option *ngFor="let a of activityTypes" [ngValue]="a?.id">
          {{ a?.activityName }}
        </option>
      </select>
    </div>
  </div>
<!-- زر عرض التقرير -->
<div class="flex items-center justify-end w-full mt-6 md:col-span-3">
  <button
    type="button"
    (click)="goToResult()"
    class="bg-gradient-to-br from-blue-600 to-blue-700 hover:from-blue-700 hover:to-blue-800 
           text-white px-6 py-3 rounded-xl shadow-md hover:shadow-lg transition 
           flex items-center gap-2 font-semibold">
    <i class="fa fa-magnifying-glass-chart text-base"></i>
    <span>عرض التقرير</span>
  </button>
</div>

</form>


  </div>

</div>
