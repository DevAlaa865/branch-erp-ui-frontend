<div class="page-container">

  <!-- عنوان الصفحة -->
  <div class="page-header">
    <h2 class="page-title">تقرير مبيعات المدن والفروع</h2>
  </div>

  <!-- بطاقة الفلترة -->
  <div class="card filter-card">

    <!-- التاريخ من / إلى -->
    <div class="filter-row">
      <div class="filter-item">
        <label>من تاريخ</label>
        <input type="date" class="input" formControlName="fromDate">
      </div>

      <div class="filter-item">
        <label>إلى تاريخ</label>
        <input type="date" class="input" formControlName="toDate">
      </div>
    </div>

    <!-- المدن -->
    <div class="filter-row">
      <div class="filter-item full">
        <label>المدن</label>

        <app-custom-select
          class="w-full"
          [items]="cities"
          bindLabel="name"
          bindValue="id"
          placeholder="اختر المدن"
          [multiple]="true"
          [searchable]="true"
          [control]="form.get('cityIds')"
          (change)="onCitiesChange()">
        </app-custom-select>
      </div>
    </div>

    <!-- الفروع -->
    <div class="filter-row">
      <div class="filter-item full">
        <label>الفروع</label>

        <app-custom-select
          class="w-full"
          [items]="branches"
          bindLabel="name"
          bindValue="id"
          placeholder="اختر الفروع"
          [multiple]="true"
          [searchable]="true"
          [control]="form.get('branchIds')">
        </app-custom-select>
      </div>
    </div>

    <!-- النشاط + نوع الفرع -->
    <div class="filter-row">
      <div class="filter-item">
        <label>نوع النشاط</label>

        <app-custom-select
          class="w-full"
          [items]="activityTypes"
          bindLabel="name"
          bindValue="id"
          placeholder="اختر النشاط"
          [control]="form.get('activityTypeId')">
        </app-custom-select>
      </div>

      <div class="filter-item">
        <label>نوع الفرع</label>

        <app-custom-select
          class="w-full"
          [items]="branchTypes"
          bindLabel="label"
          bindValue="value"
          placeholder="نوع الفرع"
          [control]="form.get('branchType')">
        </app-custom-select>
      </div>
    </div>

    <!-- زر عرض التقرير -->
    <div class="filter-actions">
      <button class="btn-primary" (click)="showResult()">
        عرض التقرير
      </button>
    </div>

  </div>

</div>
