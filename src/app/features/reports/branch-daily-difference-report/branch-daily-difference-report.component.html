<div class="bg-white p-6 rounded-xl shadow border border-slate-200">

    <!-- التاريخ من وإلى -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">

  <div>
    <label class="font-semibold text-slate-700">من تاريخ</label>
    <input 
      type="date" 
      class="w-full border rounded p-2"
      [(ngModel)]="filter.fromDate">
  </div>

  <div>
    <label class="font-semibold text-slate-700">إلى تاريخ</label>
    <input 
      type="date" 
      class="w-full border rounded p-2"
      [(ngModel)]="filter.toDate">
  </div>

</div>

  <!-- المدينة -->
  <div class="mb-4">
    <label class="font-semibold text-slate-700">المدينة</label>
    <select class="w-full border rounded p-2" [(ngModel)]="filter.cityId" (change)="loadBranches()">
      <option value="">اختر المدينة</option>
      <option *ngFor="let c of cities" [value]="c.id">{{ c.name }}</option>
    </select>
  </div>

  <!-- الفروع -->
  <div class="mb-4">
    <label class="font-semibold text-slate-700">الفروع</label>
    <select class="w-full border rounded p-2" multiple [(ngModel)]="filter.branchIds">
      <option *ngFor="let b of branches" [value]="b.id">{{ b.name }}</option>
    </select>
  </div>

  <!-- الفرق -->
  <div class="mb-4">
    <label class="font-semibold text-slate-700">الفرق</label>
    <div class="flex gap-4 mt-2">
      <label class="flex items-center gap-2">
        <input type="radio" name="diff" (change)="selectDiff('less')" />
        أقل من أو يساوي 35 ريال
      </label>
      <label class="flex items-center gap-2">
        <input type="radio" name="diff" (change)="selectDiff('greater')" />
        أكبر من 35 ريال
      </label>
    </div>
  </div>

  <!-- تقرير الشبكة -->
  <div class="mb-4">
    <label class="flex items-center gap-2">
      <input type="checkbox" [(ngModel)]="filter.isNetworkReport" />
      تقرير الشبكة فقط
    </label>
  </div>

  <!-- زر عرض التقرير -->
  <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700"
          (click)="loadReport()">
    عرض التقرير
  </button>
</div>

<!-- جدول التقرير -->
<div *ngIf="reportData.length > 0" class="mt-6">
  <table class="w-full border-collapse border border-slate-300">
    <thead class="bg-slate-100">
      <tr>
        <th class="border p-2">رقم الفرع</th>
        <th class="border p-2">اسم الفرع</th>
        <th class="border p-2" *ngIf="!filter.isNetworkReport">قيمة الفرق</th>
        <th class="border p-2" *ngIf="filter.isNetworkReport">قيمة الشبكة</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let r of reportData">
        <td class="border p-2">{{ r.branchId }}</td>
        <td class="border p-2">{{ r.branchName }}</td>
        <td class="border p-2" *ngIf="!filter.isNetworkReport">{{ r.difference }}</td>
        <td class="border p-2" *ngIf="filter.isNetworkReport">{{ r.networkAmount }}</td>
      </tr>
    </tbody>
  </table>
  <!-- 🔢 الباجينيشن -->
<div *ngIf="totalPages > 1" class="flex justify-center items-center gap-4 mt-6">

  <button
    (click)="previousPage()"
    [disabled]="currentPage === 1"
    class="bg-slate-300 hover:bg-slate-400 text-black px-3 py-1 rounded transition disabled:opacity-50"
  >
    ⬅️ السابق
  </button>

  <span class="text-slate-700 font-semibold">
    صفحة {{ currentPage }} من {{ totalPages }}
  </span>

  <button
    (click)="nextPage()"
    [disabled]="currentPage === totalPages"
    class="bg-slate-300 hover:bg-slate-400 text-black px-3 py-1 rounded transition disabled:opacity-50"
  >
    التالي ➡️
  </button>

</div>

</div>
