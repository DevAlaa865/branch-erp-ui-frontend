<form [formGroup]="form" (ngSubmit)="submit()"
      class="backdrop-blur-xl bg-white/70 border border-slate-200/60 shadow-2xl rounded-3xl p-6 mb-8 transition-all duration-300 hover:shadow-[0_8px_30px_rgba(0,0,0,0.12)]">

  <div class="row">

    <!-- المستخدم -->
    <div class="col-md-4 mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">المستخدم</label>

      <div class="flex items-center gap-2 bg-white/80 border border-slate-300 rounded-xl px-3 py-2 shadow-sm hover:shadow-md transition-all">
        <i class="fa fa-user text-blue-500 text-lg"></i>

        <app-custom-select
          class="w-full bg-transparent"
          [items]="users"
          bindLabel="displayName"
          bindValue="id"
          [control]="form.controls['userId']"
          (change)="onUserChange()">
        </app-custom-select>
      </div>
    </div>

    <!-- التاريخ -->
    <div class="col-md-4 mb-4">
      <label class="block text-sm font-semibold text-slate-700 mb-2">التاريخ</label>

      <div class="flex items-center gap-2 bg-white/80 border border-slate-300 rounded-xl px-3 py-2 shadow-sm hover:shadow-md transition-all">
        <i class="fa fa-calendar text-blue-500 text-lg"></i>

        <input type="date"
               formControlName="date"
               lang="en"
               class="w-full bg-transparent text-slate-700 text-base focus:outline-none">
      </div>
    </div>

    <!-- زر الترحيل -->
    <div class="col-md-4 d-flex align-items-end mb-4">
      <button
        type="submit"
        class="w-full py-3 px-6 rounded-2xl font-semibold text-white text-center
               bg-gradient-to-r from-blue-600 to-indigo-500 
               hover:from-blue-700 hover:to-indigo-600 
               shadow-lg hover:shadow-xl transition-all duration-300 
               transform hover:-translate-y-0.5 focus:outline-none focus:ring-2 focus:ring-blue-400">
        {{ loading ? 'جاري الترحيل...' : 'ترحيل اليوميات' }}
      </button>
    </div>

  </div>

</form>

<!-- 🔥 Toast الاحترافي في منتصف الشاشة -->
<div 
  *ngIf="toastMessage"
  class="fixed inset-0 flex items-center justify-center z-50"
>
  <div
    class="px-6 py-5 rounded-3xl shadow-2xl text-slate-900 text-center
           bg-gradient-to-r from-indigo-100 via-purple-100 to-slate-100
           border border-slate-300 animate-fade-in max-w-lg w-[90%]"
    style="backdrop-filter: blur(12px);"
  >
    <div class="font-bold text-xl mb-2 text-indigo-700">نتيجة الترحيل</div>
    <div class="text-sm leading-relaxed whitespace-pre-line">{{ toastMessage }}</div>
  </div>
</div>
