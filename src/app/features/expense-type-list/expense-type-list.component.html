<div class="bg-white shadow-lg rounded-xl p-6">

  <!-- Header -->
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold text-slate-700">أنواع المصروفات</h2>

    <button
      class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition"
      (click)="goCreate()">
      إضافة نوع
    </button>
  </div>
<!-- جدول أنواع المصروفات -->
<table class="w-full text-blue-800 border-collapse text-sm mt-6" *ngIf="items.length > 0">
  <thead>
    <tr class="bg-slate-100 text-slate-700">
      <th class="border p-2 text-center">الاسم</th>
      <th class="border p-2 text-center">الوصف</th>
      <th class="border p-2 text-center">التصنيف</th>
      <th class="border p-2 text-center">الحالة</th>
      <th class="border p-2 text-center">إجراءات</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let item of items" class="hover:bg-slate-50">
      
      <!-- الاسم -->
      <td class="border p-2 text-blue-800 font-bold text-center">
        {{ item.name }}
      </td>

      <!-- الوصف -->
      <td class="border p-2 text-blue-800 font-bold text-center">
        {{ item.description }}
      </td>

      <!-- التصنيف بالاسم -->
      <td class="border p-2 text-blue-800 font-bold text-center">
        {{ categoryName(item.category) }}
      </td>

      <!-- الحالة -->
      <td class="border p-2 text-blue-800 font-bold text-center">
        <span 
          class="px-2 py-1 rounded text-xs"
          [ngClass]="item.isActive 
            ? 'bg-green-500 text-white' 
            : 'bg-red-500 text-white'">
          {{ item.isActive ? 'نشط' : 'متوقف' }}
        </span>
      </td>

      <!-- الإجراءات -->
      <td class="border p-2 text-center">
        <div class="flex justify-center gap-2">

          <button 
            (click)="goEdit(item.id)"
            class="bg-blue-500 text-white px-3 py-1 rounded hover:bg-blue-600 text-xs">
            تعديل
          </button>

          <button 
            *ngIf="item.isActive"
            (click)="deactivate(item.id)"
            class="bg-red-500 text-white px-3 py-1 rounded hover:bg-red-600 text-xs">
            إيقاف
          </button>

          <button 
            *ngIf="!item.isActive"
            (click)="activate(item.id)"
            class="bg-green-500 text-white px-3 py-1 rounded hover:bg-green-600 text-xs">
            تفعيل
          </button>

        </div>
      </td>

    </tr>
  </tbody>
</table>




</div>
