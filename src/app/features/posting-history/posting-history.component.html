<div class="p-6 space-y-6">

  <h1 class="text-2xl font-bold text-gray-800">سجل الترحيل اليومي</h1>

  <form [formGroup]="form" class="mb-4">
    <label class="block text-sm font-semibold text-slate-700 mb-2">التاريخ</label>

    <div class="flex items-center gap-2 bg-white/80 border border-slate-300 rounded-xl px-3 py-2 shadow-sm">
      <i class="fa fa-calendar text-blue-500 text-lg"></i>

      <input type="date"
             formControlName="date"
             lang="en"
             class="w-full bg-transparent text-slate-700 text-base focus:outline-none"
             (change)="loadHistory()">
    </div>
  </form>

  <table class="min-w-full bg-white rounded-xl shadow">
    <thead>
      <tr class="bg-slate-100 text-slate-700">
        <th class="p-3">الصندوق</th>
        <th class="p-3">مسؤول الإيداع</th>
        <th class="p-3">الفرع</th>
        <th class="p-3">المدينة</th>
        <th class="p-3">المبلغ</th>
        <th class="p-3">تفاصيل</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let item of history" class="border-b">
        <td class="p-3 text-blue-800 font-bold">{{ item.cashBoxName }}</td>
        <td class="p-3 text-blue-800 font-bold">{{ item.collectorName }}</td>
        <td class="p-3 text-blue-800 font-bold">{{ item.branchName }}</td>
        <td class="p-3 text-blue-800 font-bold">{{ item.cityName }}</td>
        <td class="p-3 text-blue-800 font-bold">{{ item.amount | number }}</td>
        <td class="p-3 text-blue-800 font-bold">
          <a [routerLink]="['/cash-management/posting-details', item.id]"
             class="text-blue-600 hover:underline">
            عرض
          </a>
        </td>
      </tr>
    </tbody>
  </table>

</div>
