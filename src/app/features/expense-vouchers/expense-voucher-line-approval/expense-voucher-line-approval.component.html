<div class="container mx-auto p-4">

  <h2 class="text-xl font-bold mb-4">اعتماد السطر</h2>

  <div class="space-y-4">

    <div>
      <label class="font-bold">الدور:</label>
      <select class="input" [(ngModel)]="role">
        <option [value]="0">مدير</option>
        <option [value]="1">HR</option>
        <option [value]="2">محاسب</option>
        <option [value]="3">مدير مالي</option>
        <option [value]="4">مدير عام</option>
      </select>
    </div>

    <div>
      <label class="font-bold">ملاحظات:</label>
      <textarea class="input" [(ngModel)]="notes"></textarea>
    </div>

    <button
      class="bg-green-600 text-white px-4 py-2 rounded"
      (click)="approve()"
    >
      اعتماد السطر
    </button>

  </div>

</div>
