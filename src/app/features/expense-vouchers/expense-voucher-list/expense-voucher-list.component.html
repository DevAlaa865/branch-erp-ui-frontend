<div class="container mx-auto p-4">

  <div class="flex justify-between items-center mb-4">
    <h2 class="text-xl font-bold">سندات الصرف</h2>

    <button
      class="bg-blue-600 text-white px-4 py-2 rounded"
      (click)="createNew()">
      + سند صرف جديد
    </button>
  </div>

  <div *ngIf="loading" class="text-center py-10">
    <div class="loader"></div>
  </div>

  <div *ngIf="!loading && vouchers.length === 0" class="text-center py-10">
    لا توجد سندات صرف.
  </div>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">

    <div
      *ngFor="let v of vouchers"
      class="border rounded p-4 shadow hover:shadow-lg transition cursor-pointer"
      (click)="openDetails(v.id)"
    >
      <div class="font-bold text-lg mb-2">
        رقم السند: {{ v.voucherNumber }}
      </div>

      <div class="text-sm text-gray-600 mb-1">
        التاريخ: {{ v.voucherDate | date:'yyyy/MM/dd' }}
      </div>

      <div class="text-sm text-gray-600 mb-1">
        المبلغ: {{ v.totalAmount | number }}
      </div>

      <div class="text-sm text-gray-600 mb-1">
        الحالة: {{ v.status }}
      </div>

      <div class="text-sm text-gray-600">
        المصدر: {{ v.source === 0 ? 'مسؤول إيداع' : 'تسوية عهدة' }}
      </div>
    </div>

  </div>

</div>
