<div class="p-6 space-y-6">

  <h1 class="text-2xl font-bold text-gray-800">أصحاب العهد (Petty Holders)</h1>

  <!-- FORM -->
  <form [formGroup]="form" class="grid grid-cols-1 md:grid-cols-3 gap-4 bg-white p-4 rounded-xl shadow">

    <app-custom-select
      label="المستخدم (اختياري)"
      [items]="users"
      bindLabel="userName"
      bindValue="id"
      [control]="form.get('userId')">
    </app-custom-select>

    <!-- 🔥 Multi-Select Cities -->
    <app-custom-select
      label="المدن"
      [items]="cities"
      bindLabel="cityName"
      bindValue="id"
      [multiple]="true"
      [control]="form.get('cityIds')">
    </app-custom-select>

    <app-custom-select
      label="المنطقة"
      [items]="regions"
      bindLabel="regionName"
      bindValue="id"
      [control]="form.get('regionId')">
    </app-custom-select>

    <input type="text" formControlName="name"
           placeholder="اسم صاحب العهدة"
           class="p-3 border rounded-lg text-blue-600 font-bold" />

    <input type="text" formControlName="phoneNumber"
           placeholder="رقم الجوال"
           class="p-3 border rounded-lg text-blue-600 font-bold" />

    <div class="flex items-center gap-2">
      <input type="checkbox" formControlName="isActive" />
      <label>نشط</label>
    </div>

    <button type="button"
            (click)="save()"
            class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg shadow">
      {{ isEdit ? 'تحديث' : 'حفظ' }}
    </button>

    <button type="button"
            (click)="resetForm()"
            class="px-4 py-2 bg-gray-400 hover:bg-gray-500 text-white rounded-lg shadow">
      إعادة تعيين
    </button>

  </form>

  <!-- TABLE -->
  <div class="bg-white rounded-xl shadow border border-gray-100 overflow-x-auto">
    <table class="w-full text-right border-collapse table-fixed min-w-[700px]">
      <thead class="bg-slate-100 text-slate-700 text-xs ">
        <tr class="text-center">
          <th class="p-3 border text-center">الاسم</th>
          <th class="p-3 border text-center">رقم الجوال</th>
          <th class="p-3 border text-center">المدن</th>
          <th class="p-3 border text-center">المنطقة</th>
          <th class="p-3 border text-center">الحالة</th>
          <th class="p-3 border text-center">إجراءات</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let item of pettyHolders" class="text-sm hover:bg-slate-50">

          <td class="p-3 border text-blue-800 font-bold text-center">{{ item.name }}</td>
          <td class="p-3 border text-blue-800 font-bold text-center">{{ item.phoneNumber }}</td>

          <!-- 🔥 عرض المدن كبادجات -->
          <td class="p-3 border text-blue-800 font-bold text-center">
            <ng-container *ngIf="item.cityNames?.length > 0; else noCities">
              <span *ngFor="let c of item.cityNames"
                    class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs mx-1">
                {{ c }}
              </span>
            </ng-container>
            <ng-template #noCities>
              <span class="text-slate-400 text-xs">لا توجد مدن</span>
            </ng-template>
          </td>

          <td class="p-3 border text-blue-800 font-bold text-center">{{ item.regionName }}</td>

          <td class="p-3 border text-blue-800 font-bold text-center">
            <span
              class="px-3 py-1 rounded-full text-white text-xs"
              [class.bg-green-600]="item.isActive"
              [class.bg-red-600]="!item.isActive">
              {{ item.isActive ? 'نشط' : 'غير نشط' }}
            </span>
          </td>

          <td class="p-3 border text-blue-800 font-bold text-center">
            <div class="flex gap-2">

              <button
                class="bg-blue-500 hover:bg-blue-600 text-white px-3 py-1 rounded text-xs"
                (click)="edit(item)">
                تعديل
              </button>

              <button
                class="bg-yellow-500 hover:bg-yellow-600 text-white px-3 py-1 rounded text-xs"
                (click)="toggleActive(item)">
                {{ item.isActive ? 'تعطيل' : 'تفعيل' }}
              </button>

            </div>
          </td>

        </tr>
      </tbody>
    </table>
  </div>

</div>
